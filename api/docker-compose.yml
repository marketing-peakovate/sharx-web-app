# Local development only: Postgres. No Redis or other services (ARCHITECTURE §10).
# Host port 5433 avoids clashing with a natively installed Postgres on 5432.
name: sharkx-crm

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharkx
      POSTGRES_PASSWORD: sharkx
      POSTGRES_DB: sharkx
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharkx -d sharkx"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
