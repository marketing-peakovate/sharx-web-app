<title>SHARKX Agency CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black SHARKX nav rail + white top bar over a soft-grey working canvas; one red action per screen.
   Single light theme by design (SHARKX brand book keeps data on light canvases). */
:root{
  --red:#e70101; --black:#1c0f0f; --white:#ffffff;
  --tint:#fde6e6; --tint40:#f59999; --tint60:#f16767;
  --g10:#e8e7e7; --g40:#a49f9f; --g60:#776f6f; --muted:#5c5656;
  --page:#fafafa; --shell:#f5f5f5;
  --ok:#0a7c42; --warn:#ff691e; --bad:#b91c1c;
  --rail-fg:rgba(255,255,255,.62); --rail-hover:rgba(255,255,255,.09);
  --line:rgba(28,15,15,.10); --overlay:rgba(28,15,15,.42);
  --font:"Sharp Sans","Manrope","Segoe UI",system-ui,sans-serif;
  --r-card:16px; --r-btn:12px; --r-in:10px;
  --sh:0 1px 3px rgba(28,15,15,.08); --sh-md:0 4px 12px rgba(28,15,15,.10); --sh-lg:0 18px 48px rgba(28,15,15,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--black);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.num,td.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px} svg.i.lg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;height:100dvh;min-height:0}
.rail{background:var(--black);display:flex;flex-direction:column;align-items:center;padding:16px 0 14px;gap:4px;z-index:30}
.rail .logo{width:42px;height:42px;border-radius:12px;margin-bottom:14px;display:block}
.navbtn{width:50px;height:46px;border-radius:12px;color:var(--rail-fg);display:grid;place-items:center;position:relative;transition:background .15s,color .15s}
.navbtn:hover{background:var(--rail-hover);color:var(--white)}
.navbtn.active{color:var(--white);background:rgba(255,255,255,.12)}
.navbtn.active::before{content:"";position:absolute;left:-13px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.navbtn .tip{position:absolute;left:58px;top:50%;transform:translateY(-50%);background:var(--black);color:var(--white);font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:var(--sh-md)}
.navbtn:hover .tip{opacity:1}
.navbtn .dot{position:absolute;top:7px;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:var(--white);font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--black)}
.rail .spacer{flex:1}
.rail .me{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--black);font-weight:800;font-size:12px;display:grid;place-items:center}

.main{display:grid;grid-template-rows:62px minmax(0,1fr);min-width:0;min-height:0;height:100%;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--g10);display:flex;align-items:center;gap:12px;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-right,0px));padding-left:20px}
.switcher{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 8px;border-radius:12px;border:1px solid var(--g10);background:var(--white);min-width:0;max-width:320px}
.switcher:hover{background:var(--shell)}
.switcher .sw{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--white);font-weight:800;font-size:12px;flex:none}
.switcher{overflow:hidden}
.switcher .t{overflow:hidden;flex:1;display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.15}
.switcher .t b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.switcher .t small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;background:var(--shell);color:var(--muted);border:1px solid transparent}
.search:hover{border-color:var(--g10)}
.search kbd{margin-left:auto;font:600 11px var(--font);background:var(--white);border:1px solid var(--g10);border-radius:6px;padding:2px 6px;color:var(--muted)}
.topbar .grow{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(10,124,66,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,124,66,.45)}70%{box-shadow:0 0 0 8px rgba(10,124,66,0)}100%{box-shadow:0 0 0 0 rgba(10,124,66,0)}}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--black);position:relative}
.iconbtn:hover{background:var(--shell)}
.iconbtn .cnt{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--white)}

.content{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-width:0;min-height:0;padding-block:28px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.content.flush{padding:0;overflow:hidden}
.wrap{max-width:72rem;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead .h{flex:1;min-width:220px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
h1{font-size:26px;line-height:1.15;margin:4px 0 0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:700}
h3{font-size:14px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:6px 0 0}
.trust{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r-btn);font-weight:700;font-size:13.5px;border:1px solid var(--g10);background:var(--white);color:var(--black);white-space:nowrap;transition:filter .15s,background .15s,transform .05s}
.btn:hover{background:var(--shell)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--white)} .btn.primary:hover{filter:brightness(.92)}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--white)} .btn.dark:hover{filter:brightness(1.35)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--shell)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--white);border:1px solid var(--g10);border-radius:var(--r-card);box-shadow:var(--sh)}
.card .hd{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card .bd{padding:16px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--white);border:1px solid var(--g10);border-radius:var(--r-card);padding:14px 16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .d{font-size:11.5px;font-weight:700;align-self:flex-start;padding:2px 7px;border-radius:7px;background:var(--tint);color:var(--black);font-variant-numeric:tabular-nums}
.kpi .d.down{background:var(--shell)}
.kpi .d.down::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:1px}
.kpi.hl{border-color:var(--red);box-shadow:0 0 0 3px var(--tint)}

.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.new{background:var(--g10);color:var(--black)} .pill.new::before{background:var(--g60)}
.pill.mql{background:var(--tint);color:var(--black)} .pill.mql::before{background:var(--red)}
.pill.sql{background:var(--black);color:var(--white)} .pill.sql::before{background:var(--white)}
.pill.won{background:var(--white);color:var(--black);border-color:var(--g10)} .pill.won::before{background:var(--ok)}
.pill.nq{background:var(--white);color:var(--bad);border-color:var(--bad)} .pill.nq::before{background:var(--bad)}
.pill.junk{background:var(--shell);color:var(--g60)} .pill.junk::before{background:var(--g40)}
.pill.ok{background:var(--white);color:var(--black);border-color:var(--g10)} .pill.ok::before{background:var(--ok)}
.pill.warn{background:var(--white);color:var(--black);border-color:var(--warn)} .pill.warn::before{background:var(--warn)}
.pill.bad{background:var(--tint);color:var(--bad);border-color:var(--bad)} .pill.bad::before{background:var(--bad)}
.pill.off{background:var(--shell);color:var(--muted)} .pill.off::before{background:var(--g40)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--g10);background:var(--white);font-weight:600;font-size:12.5px;white-space:nowrap}
.chip:hover{background:var(--shell)}
.chip.on{background:var(--black);border-color:var(--black);color:var(--white)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7;font-weight:700}
.chip i.nd{width:8px;height:8px;border-radius:50%}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--shell);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap}
.src .mk{width:22px;height:22px;border-radius:7px;background:var(--black);color:var(--white);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;background:var(--g10);color:var(--black);flex:none}
.av.lg{width:40px;height:40px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.muted{color:var(--muted)} .faint{color:var(--g40)} .b{font-weight:700}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.input,.select,textarea.input{height:38px;border:1px solid var(--g10);border-radius:var(--r-in);background:var(--white);padding:0 12px;min-width:0;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.input:focus,.select:focus,textarea.input:focus{outline:3px solid var(--tint);border-color:var(--red)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700}
label.f span.h{font-weight:500;color:var(--muted)}
.switch{width:38px;height:22px;border-radius:11px;background:var(--g40);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--white);transition:left .15s;box-shadow:var(--sh)}
.switch.on{background:var(--black)} .switch.on::after{left:19px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--g10);overflow-x:auto}
.tab{padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--black)}
.tab.on{color:var(--black);border-bottom-color:var(--red)}
.tab .c{font-size:11px;background:var(--shell);border-radius:6px;padding:1px 6px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on .c{background:var(--tint);color:var(--black)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--black);font-size:15px;margin-bottom:4px}
hr.sep{border:0;border-top:1px solid var(--g10);margin:0}

/* tables */
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.t th{position:sticky;top:0;background:var(--shell);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--g10);white-space:nowrap;z-index:1}
table.t td{padding:11px 12px;border-bottom:1px solid var(--g10);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--page)}
table.t tr.sel td{background:var(--tint)}
table.t td.r,table.t th.r{text-align:right}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--red);cursor:pointer}

/* popover menus */
.menu{position:fixed;z-index:100;background:var(--white);border:1px solid var(--g10);border-radius:14px;box-shadow:var(--sh-lg);padding:6px;min-width:220px;max-height:70vh;overflow:auto}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-weight:600}
.menu .mi:hover,.menu .mi.kb{background:var(--shell)}
.menu .mh{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.menu hr{border:0;border-top:1px solid var(--g10);margin:6px 2px}

/* modal + drawer */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--white);border-radius:20px;box-shadow:var(--sh-lg);width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;animation:pop .18s ease-out}
.modal.wide{width:min(720px,100%)}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.modal .mh .x{margin-left:auto}
.modal .mb{padding:16px 22px 6px;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 20px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--white);z-index:91;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slide .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{padding:20px 22px 14px;border-bottom:1px solid var(--g10);display:flex;gap:12px;align-items:flex-start}
.drawer .db{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:18px}
@keyframes fade{from{opacity:0}} @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}} @keyframes slide{from{transform:translateX(30px);opacity:0}}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--g10)}
.steps i.on{background:var(--red)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--g10);border-top-color:var(--red);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.progress{height:6px;border-radius:3px;background:var(--g10);overflow:hidden}
.progress i{display:block;height:100%;background:var(--black);border-radius:3px;transition:width .4s}

/* toast */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--black);color:var(--white);padding:11px 14px;border-radius:12px;box-shadow:var(--sh-lg);font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;max-width:380px;animation:pop .2s ease-out}
.toast .tt{color:var(--tint40);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:block}
.toast button{color:var(--tint40);font-weight:700;margin-left:6px}

/* home */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:16px 18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-align:left}
.pcard:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--white);font-weight:800}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats div{background:var(--page);border-radius:10px;padding:8px 10px}
.pstats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pstats span{font-size:11px;color:var(--muted);font-weight:600}
.health{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.health i{width:9px;height:9px;border-radius:50%}
.h-ok{background:var(--ok)} .h-warn{background:var(--warn)} .h-bad{background:var(--bad)} .h-off{background:var(--g10)}
.att{display:flex;flex-direction:column}
.att .it{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--g10)}
.att .it:first-child{border-top:0}
.att .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tint);color:var(--red);flex:none}
.att .ic.n{background:var(--shell);color:var(--black)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--shell);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:5px;background:var(--black)}
.bar:first-child .tr i{background:var(--red)}
.bar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* inbox */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr);height:100%;min-height:0;background:var(--white)}
.ilist{border-right:1px solid var(--g10);display:flex;flex-direction:column;min-height:0;background:var(--page)}
.ilist .ih{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--white);border-bottom:1px solid var(--g10)}
.ilist .tabs{border-bottom:0;margin:0 -4px}
.ilist .tab{padding:9px 8px}
.numchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.numchips .chip{height:28px;font-size:12px;padding:0 10px}
.chats{overflow:auto;flex:1}
.ci{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:12px 16px;border-bottom:1px solid var(--g10);text-align:left;width:100%;background:var(--white);position:relative}
.ci:hover{background:var(--shell)}
.ci.on{background:var(--tint)}
.ci.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.ci .av{grid-row:span 2;align-self:center}
.ci .nm{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.ci .nm .nd{width:7px;height:7px;border-radius:50%;flex:none}
.ci .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ci .pv{color:var(--muted);font-size:12.5px}
.ci.unread .pv{color:var(--black);font-weight:600}
.ci .ub{min-width:19px;height:19px;border-radius:10px;background:var(--red);color:var(--white);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;justify-self:end}
.ci .pj{font-size:11px;color:var(--muted);font-weight:700}
.thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.thead{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--g10);min-height:64px}
.thead .back{display:none}
.track{display:flex;gap:10px;align-items:center;background:var(--shell);padding:9px 18px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--g10)}
.track b{color:var(--black)}
.msgs{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:10px;background:var(--page)}
.day{align-self:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--white);border:1px solid var(--g10);border-radius:999px;padding:3px 10px}
.msg{max-width:min(520px,78%);padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.45;box-shadow:var(--sh);overflow-wrap:anywhere}
.msg.in{align-self:flex-start;background:var(--white);border:1px solid var(--g10);border-bottom-left-radius:5px}
.msg.out{align-self:flex-end;background:var(--tint);border-bottom-right-radius:5px}
.msg .meta{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.msg .via{font-size:10.5px;font-weight:700;color:var(--g60);margin-top:2px;text-align:right}
.msg.note{align-self:center;background:var(--white);border:1px dashed var(--g40);box-shadow:none;max-width:min(560px,92%);font-size:13px}
.msg.note .who{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.msg.ad{align-self:flex-start;background:var(--white);border:1px solid var(--g10);font-size:12px;color:var(--muted);box-shadow:none}
.composer{padding:12px 18px 14px;border-top:1px solid var(--g10);display:flex;flex-direction:column;gap:8px;background:var(--white)}
.composer .rowc{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-height:42px;max-height:120px}
.composer .hint{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.details{border-left:1px solid var(--g10);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.qual{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qbtn{height:36px;border-radius:10px;border:1px solid var(--g10);font-weight:800;font-size:12.5px;background:var(--white)}
.qbtn:hover{background:var(--shell)}
.qbtn.on.mql{background:var(--tint);border-color:var(--red)}
.qbtn.on.sql{background:var(--black);color:var(--white);border-color:var(--black)}
.qbtn.on.nq{border-color:var(--bad);color:var(--bad);background:var(--tint)}
.sec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
.qa{display:flex;flex-direction:column;gap:8px}
.qa div{background:var(--page);border-radius:10px;padding:8px 10px;font-size:13px}
.qa div span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.tl{display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.tl div{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline}
.tl i{width:8px;height:8px;border-radius:50%;background:var(--g40);transform:translateY(1px)}
.tl i.r{background:var(--red)}

/* pipeline */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 272px;background:var(--shell);border-radius:var(--r-card);display:flex;flex-direction:column;max-height:calc(100dvh - 250px);border:1px solid transparent}
.col.over{border-color:var(--red);background:var(--tint)}
.col .ch{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
.col .ch .cnt{font-size:12px;font-weight:800;background:var(--white);border-radius:7px;padding:1px 7px;font-variant-numeric:tabular-nums}
.col .ch .val{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.col .cards{padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:60px}
.kc{background:var(--white);border:1px solid var(--g10);border-radius:12px;padding:11px 12px;box-shadow:var(--sh);cursor:grab;display:flex;flex-direction:column;gap:8px}
.kc:active{cursor:grabbing}
.kc.dragging{opacity:.45}
.kc .k1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kc .k2{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.kc .amt{font-weight:800;color:var(--black);font-variant-numeric:tabular-nums}
.kc select{font-size:11.5px;height:26px;border:1px solid var(--g10);border-radius:8px;background:var(--white);padding:0 6px;display:none}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:6px}
.fs{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center}
.fs .fb{height:34px;border-radius:9px;background:var(--black);display:flex;align-items:center;padding-left:12px;color:var(--white);font-weight:800;font-variant-numeric:tabular-nums;min-width:48px}
.fs:first-child .fb{background:var(--red)}
.fs .cv{font-size:12px;color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* integrations */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ic2{padding:18px;display:flex;flex-direction:column;gap:14px}
.ic2 .it{display:flex;gap:12px;align-items:center}
.plogo{width:42px;height:42px;border-radius:12px;background:var(--black);color:var(--white);font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.plogo.wa{background:var(--red)}
.nums{display:flex;flex-direction:column;gap:8px}
.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--page);border:1px solid var(--g10)}
.nrow .nd{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.nrow small{color:var(--muted);font-size:12px}
.nrow .progress{grid-column:2/4;margin-top:4px}
.ic2 .meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ic2 .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.snippet{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--black);color:var(--g10);padding:12px 14px;border-radius:12px;overflow-x:auto;white-space:pre}
.pick{display:flex;flex-direction:column;gap:8px}
.pick label{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--g10);border-radius:12px;cursor:pointer}
.pick label:hover{background:var(--page)}
.pick label small{display:block;color:var(--muted);font-size:12px}
.okmark{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--red);display:grid;place-items:center;margin:4px auto}
.okmark svg{width:28px;height:28px;stroke-width:2.4}
.center{text-align:center}

/* settings */
.setgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.setnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.setnav button{text-align:left;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--muted)}
.setnav button:hover{background:var(--shell);color:var(--black)}
.setnav button.on{background:var(--white);color:var(--black);box-shadow:var(--sh);border:1px solid var(--g10)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--page);border:1px solid var(--g10);border-radius:12px;padding:6px 6px 6px 12px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.linkbox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle-row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--g10)}
.toggle-row:first-child{border-top:0}
.reason{display:inline-flex;gap:6px;align-items:center;height:30px;padding:0 6px 0 11px;border-radius:999px;background:var(--shell);font-weight:600;font-size:12.5px}
.reason button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.reason button:hover{background:var(--g10)}

/* automation */
.rule{display:flex;gap:14px;align-items:center;padding:16px 18px;flex-wrap:wrap}
.rule .flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1;min-width:240px}
.rule .flow .w{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.rule .flow .s{background:var(--page);border:1px solid var(--g10);border-radius:9px;padding:4px 9px;font-weight:600;font-size:13px}

/* portal */
.portal{position:fixed;inset:0;z-index:70;background:var(--page);overflow:auto}
.pbar{position:sticky;top:0;z-index:5;background:var(--black);color:var(--white);display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));font-size:13px;font-weight:600}
.pbar .btn{height:32px;background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}
.pbar .btn:hover{background:rgba(255,255,255,.1)}
.phead{background:var(--white);border-bottom:1px solid var(--g10)}
.phead .in{max-width:72rem;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 22px max(20px,env(safe-area-inset-left,0px));display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead img{height:22px;width:auto}
.pbody{max-width:72rem;margin:0 auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 60px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.prow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.8fr) 230px;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--g10)}
.prow.h{background:var(--shell);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:10px;border-top:0}
.prow .qual{grid-template-columns:repeat(3,1fr)}
.prow .exp{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.sug{font-size:11.5px;font-weight:700;color:var(--red);display:inline-flex;gap:5px;align-items:center;margin-top:3px}
.sug button{color:var(--black);text-decoration:underline;font-weight:700}

/* responsive */
@media (max-width:1180px){.inbox{grid-template-columns:300px minmax(0,1fr)}.details{display:none}.inbox.showdet .details{display:flex;position:fixed;right:0;top:0;bottom:0;width:min(340px,100%);background:var(--white);z-index:60;box-shadow:var(--sh-lg)}}
@media (max-width:900px){.two{grid-template-columns:1fr}.setgrid{grid-template-columns:1fr}.setnav{flex-direction:row;overflow-x:auto;position:static}.prow{grid-template-columns:1fr 1fr}.prow .qual,.prow .pq{grid-column:1/-1}.prow.h{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .inbox{grid-template-rows:minmax(0,1fr)}
  .rail{order:2;flex-direction:row;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));overflow-x:auto;gap:2px}
  .rail .logo,.rail .spacer,.rail .me,.navbtn .tip,.rail>[data-allclients]{display:none}
  .navbtn{width:44px;height:44px;flex:none}
  .navbtn.active::before{left:12px;right:12px;top:auto;bottom:-6px;width:auto;height:3px;border-radius:3px 3px 0 0}
  .topbar{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:8px}
  .search span,.search kbd,.live span{display:none}
  .search{flex:0 0 40px;padding:0;justify-content:center}
  .switcher{flex:1;max-width:none}
  .topbar .grow{display:none}
  .switcher .t b,.switcher .t small{max-width:100%}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
  .inbox{grid-template-columns:minmax(0,1fr)}
  .inbox .thread{display:none}
  .inbox.open .ilist{display:none}
  .inbox.open .thread{display:flex}
  .thead .back{display:grid}
  .bar{grid-template-columns:96px 1fr 40px}
  .kc select{display:block}
  .col{flex-basis:250px}
  .form{grid-template-columns:1fr}
  h1{font-size:22px}
  .kv{grid-template-columns:100px 1fr}
  .hide-sm{display:none!important}
}

function mkLead(i, opts){
  const p = opts && opts.project ? PROJECTS.find(x=>x.id===opts.project) : PROJECTS[i % PROJECTS.length];
  const srcKeys = p.ind==='Real estate SME' ? ['meta','google','website','linkedin','whatsapp','meta'] : ['meta','meta','google','youtube','tiktok','snapchat','website','ctwa','whatsapp'];
  const source = opts && opts.source || pick(srcKeys);
  const age = opts && opts.age != null ? opts.age : Math.floor(Math.pow(rnd(), 1.8) * 60 * 24 * 21);
  const statusPool = age < 90 ? ['new','new','new','mql'] : ['new','mql','mql','sql','sql','nq','won','junk','mql','sql','nq'];
  const status = opts && opts.status || pick(statusPool);
  const stage = status==='won' ? 'Won' : status==='nq'||status==='junk' ? 'Lost' : status==='sql' ? pick(['Qualified','Visit booked']) : status==='mql' ? pick(['Contacted','Qualified']) : pick(['New','New','Contacted']);
  const name = opts && opts.name || NAMES[(i * 7 + 3) % NAMES.length];
  const cc = p.city==='Casablanca' ? '+212 6' : '+971 5';
  const phone = opts && opts.phone || `${cc}${Math.floor(rnd()*9)} ${100+Math.floor(rnd()*899)} ${1000+Math.floor(rnd()*8999)}`;
  const num = pick(p.numbers);
  const lead = {
    id:'L'+(1000+i), project:p.id, name, phone, email: name.toLowerCase().replace(/[^a-z ]/g,'').split(' ').join('.')+'@mail.com',
    source, campaign: source==='website'||source==='whatsapp' ? (source==='website'?'Organic: website':'Organic: WhatsApp direct') : pick(p.campaigns),
    answers: p.q.map((q,k)=>({q, a:pick(p.answers[k])})), status, stage,
    owner: opts && opts.owner !== undefined ? opts.owner : (status==='new' && rnd()<.35 ? null : pick(TEAM).id),
    created: NOW - age*MIN, value: Math.round((p.value[0] + rnd()*(p.value[1]-p.value[0]))/50)*50,
    number: num.id, chat: [], unread: 0, starred: rnd()<.18, notes: [], reason: status==='nq' ? pick(REASONS) : null,
    suggested: status==='new' && rnd()<.4, history:[]
  };
  // chat
  const hasChat = source==='whatsapp' || source==='ctwa' || rnd() < .62;
  if (hasChat){
    const ins = INMSG[p.id], outs = OUTMSG[p.id];
    let t = lead.created + 2*MIN;
    if (source==='ctwa') lead.chat.push({dir:'ad', text:'Started from a Click-to-WhatsApp ad: '+lead.campaign, t:lead.created});
    const n = 1 + Math.floor(rnd()*4);
    for (let k=0;k<n;k++){
      lead.chat.push({dir:'in', text:ins[(k+i)%ins.length], t}); t += (3+Math.floor(rnd()*40))*MIN;
      if (k < n-1 || rnd() < .55){ lead.chat.push({dir:'out', text:outs[(k+i)%outs.length], t}); t += (5+Math.floor(rnd()*90))*MIN; }
    }
    lead.chat = lead.chat.filter(m=>m.t <= NOW);
    const last = lead.chat[lead.chat.length-1];
    if (last && last.dir==='in' && age < 60*24*2) lead.unread = 1 + Math.floor(rnd()*2);
  }
  lead.history.push({t:lead.created, text:`Lead received from ${SOURCES[source].n}`, r:true});
  if (lead.owner) lead.history.push({t:lead.created+MIN, text:`Assigned to ${TEAM.find(x=>x.id===lead.owner).n}`});
  if (status!=='new') lead.history.push({t:lead.created + Math.min(age-1, 60*24)*MIN, text:`Marked ${STATUS[status]}${status==='nq'?' ('+lead.reason+')':''} by client`, r:status==='sql'});
  return lead;
}

  closeLayer();

  $('#layer').innerHTML = `<div class="scrim" style="background:transparent;display:block" data-close></div><div class="menu" role="menu">${html}</div>`;
  const m = $('#layer .menu');
  const w = Math.max(r.width, (opts&&opts.w)||230);
  m.style.minWidth = w+'px';
  let left = r.left; if (left + w > innerWidth - 12) left = innerWidth - w - 12;
  m.style.left = Math.max(12,left)+'px';
  const top = r.bottom + 6; const mh = m.offsetHeight;
  m.style.top = (top + mh > innerHeight - 12 ? Math.max(12, r.top - mh - 6) : top)+'px';
  $('#layer [data-close]').onclick = closeLayer;
  m.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b){ onClick(b.dataset.v, b); } });
  document.addEventListener('keydown', escClose);
}

function spark(pid){
  const days = 14, arr = Array(days).fill(0);
  LEADS.filter(l=>l.project===pid).forEach(l=>{ const d = Math.floor((Date.now()-l.created)/86400000); if (d<days) arr[days-1-d]++; });

/* ---------------- actions ---------------- */
function setStatus(id, s, reason, by){
  const l = L(id); if (!l) return;
  l.status = s; l.reason = s==='nq' ? reason : null; l.suggested = false;
  l.history.push({t:Date.now(), text:`Marked ${STATUS[s]}${reason?' ('+reason+')':''} by ${by||'Aisha Rahman'}`, r:s==='sql'||s==='won'});
  const fb = SETTINGS.feedback.find(f=>f.stage===(s==='nq'?'Not qualified':STATUS[s]));
  toast(`${l.name} marked ${STATUS[s]}`, fb && fb.on ? 'Sent to Meta and Google' : 'Saved');
}
function askReason(id, by, after){
  const l = L(id);
  const m = modal(`${mhead('Why is this lead not qualified?', esc(l.name)+' · the reason helps the ads avoid similar leads')}<div class="mb"><div class="pick">${SETTINGS.reasons.map((r,i)=>`<label><input type="radio" name="rsn" value="${esc(r)}" ${i===0?'checked':''}><span>${esc(r)}</span></label>`).join('')}</div></div><div class="mf"><button class="btn" data-x>Cancel</button><button class="btn primary" id="rok">Mark not qualified</button></div>`, {nofocus:true});
  bindX(m);
  $('#rok').onclick = () => { const r = ($('input[name=rsn]:checked')||{}).value; closeLayer(); setStatus(id,'nq',r,by); after(); };
}
function addLiveLead(){
  const p = st.project==='all' ? pick(PROJECTS) : P(st.project);
  const l = mkLead(1000+LEADS.length, {project:p.id, age:0, status:'new', name:pick(NAMES), source:pick(['meta','google','tiktok','ctwa','website','meta'])});
  l.created = Date.now(); l.chat.forEach((m,i)=>m.t = Date.now()-(l.chat.length-1-i)*MIN); l.history[0].t = Date.now();
  if (l.chat.length){ l.chat = l.chat.slice(0,1); l.chat[0].t = Date.now(); if (l.chat[0].dir!=='in') l.chat[0] = {dir:'in', text:INMSG[p.id][0], t:Date.now()}; l.unread = 1; }
  LEADS.push(l);
  NOTIFS.unshift({t:Date.now(), text:`New lead from ${SOURCES[l.source].n}: ${l.name}`, p:p.id, id:l.id, read:false});
  toast(`${l.name} · ${p.name}`, 'New lead · '+SOURCES[l.source].n, {label:'Open', fn:()=>openLead(l.id)});
  if (!st.portal && !$('#layer').innerHTML) softRender(); else if (!st.portal) { renderRail(); renderTop(); }
}
function addLiveMessage(){
  const cands = LEADS.filter(l=>l.chat.length && inScope(l));
  if (!cands.length) return;
  const l = pick(cands), p = P(l.project);
  l.chat.push({dir:'in', text:pick(INMSG[p.id]), t:Date.now()}); l.unread = (l.unread||0)+1;

function commandPalette(){
  const m = modal(`<div style="padding:14px 16px;border-bottom:1px solid var(--g10)" class="row">${ic('search')}<input class="input" id="cq" placeholder="Search leads, clients or pages" style="border:0;height:36px;padding:0" autocomplete="off"></div><div id="cres" style="max-height:60vh;overflow:auto;padding:6px"></div><div class="muted" style="font-size:11.5px;padding:8px 16px;border-top:1px solid var(--g10)">↑ ↓ to move · Enter to open · Esc to close</div>`);
  let idx = 0, res = [];
  function draw(){
    const q = $('#cq').value.toLowerCase().trim();
    const pages = (st.project==='all'?[]:NAV).map(n=>({k:'Page', label:n.n, run:()=>{ st.view=n.v; render(); }}));
    const projs = [{k:'Client', label:'All clients (agency)', run:()=>{ st.project='all'; render(); }}, ...PROJECTS.map(p=>({k:'Client', label:p.name, run:()=>{ st.project=p.id; if (st.view==='home') st.view='home'; render(); }}))];
    const leads = LEADS.filter(l=>q && (l.name+' '+l.phone).toLowerCase().includes(q)).slice(0,8).map(l=>({k:'Lead', label:l.name, sub:P(l.project).name+' · '+l.phone, run:()=>openLead(l.id)}));
    res = [...leads, ...projs.filter(x=>!q||x.label.toLowerCase().includes(q)), ...pages.filter(x=>!q||x.label.toLowerCase().includes(q))].slice(0,14);
    if (idx >= res.length) idx = 0;
    $('#cres').innerHTML = res.length ? res.map((r,i)=>`<button class="menu mi ${i===idx?'kb':''}" style="position:static;box-shadow:none;border:0;padding:10px 12px" data-ci="${i}"><span class="tag">${r.k}</span><span style="flex:1;min-width:0" class="ellip"><b>${esc(r.label)}</b>${r.sub?` <span class="muted" style="font-size:12px">${esc(r.sub)}</span>`:''}</span>${ic('arrow','sm')}</button>`).join('') : '<div class="empty">No matches</div>';
  }
  $('#cq').addEventListener('input', ()=>{ idx=0; draw(); });
  $('#cq').addEventListener('keydown', e=>{ if (e.key==='ArrowDown'){ idx=Math.min(res.length-1,idx+1); draw(); e.preventDefault(); } if (e.key==='ArrowUp'){ idx=Math.max(0,idx-1); draw(); e.preventDefault(); } if (e.key==='Enter' && res[idx]){ const r=res[idx]; closeLayer(); r.run(); } });
  $('#cres').addEventListener('click', e=>{ const b=e.target.closest('[data-ci]'); if (b){ const r=res[+b.dataset.ci]; closeLayer(); r.run(); } });
  draw();
}

function csvOf(ls){
  const rows = [['Name','Phone','Email','Client','Source','Campaign','Status','Received']].concat(ls.map(l=>[l.name,l.phone,l.email,P(l.project).name,SOURCES[l.source].n,l.campaign,STATUS[l.status],new Date(l.created).toISOString().slice(0,16).replace('T',' ')]));
  return rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
}
function exportModal(ls, title){
  const csv = csvOf(ls);
  const m = modal(`${mhead(title||'Export leads', fmt(ls.length)+' leads in the current view, as CSV')}<div class="mb"><textarea class="input" id="csvtxt" rows="9" readonly style="font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace">${esc(csv)}</textarea><p class="muted" style="margin:0;font-size:12.5px">Copy and paste into Excel or Google Sheets. In the live product this downloads as a file.</p></div><div class="mf"><button class="btn" data-x>Close</button><button class="btn primary" id="cpcsv">${ic('copy','sm')}Copy CSV</button></div>`, {wide:true, nofocus:true});
  bindX(m); $('#cpcsv').onclick = () => { const t=$('#csvtxt'); t.select(); copyText(csv,'CSV'); };
}

document.addEventListener('click', e=>{

    if (t.closest('[data-act="pexport"]')) return exportModal(LEADS.filter(l=>l.project===pf.project && l.status!=='junk'), 'Export your leads');
    return;
  }
  if (t.closest('[data-allclients]')){ st.project='all'; st.view='home'; st.inbox.sel=null; closeLayer(); return render(); }
  const nav = t.closest('[data-nav]'); if (nav){ st.view = nav.dataset.nav; st.inbox.open=false; closeLayer(); return render(); }
  if (t.closest('#sw')){
    const html = `<div class="mh">Workspace</div><button class="mi" data-v="all"><img src="${LOGO_ICON}" alt="" style="width:26px;height:26px;border-radius:8px"><span style="flex:1">All clients</span>${st.project==='all'?ic('check','sm'):''}</button><hr><div class="mh">Client projects</div>` + PROJECTS.map(p=>`<button class="mi" data-v="${p.id}"><span class="av" style="background:${p.color};color:var(--white);border-radius:8px;width:26px;height:26px">${p.ini}</span><span style="flex:1;min-width:0"><span class="ellip" style="display:block">${esc(p.name)}</span><span class="muted" style="font-size:11.5px;font-weight:500">${esc(p.city)}</span></span>${st.project===p.id?ic('check','sm'):''}</button>`).join('') + `<hr><button class="mi" data-v="__new">${ic('plus','sm')}New project</button>`;
    return openMenu($('#sw'), html, v=>{ closeLayer(); if (v==='__new') return newProjectWizard(); st.project=v; if (v==='all') st.view='home'; st.inbox.sel=null; st.inbox.num='all'; st.leads.sel.clear(); render(); toast(v==='all'?'Showing all clients':P(v).name, 'Switched'); }, {w:300});
  }
  if (t.closest('#cmdk')) return commandPalette();
  if (t.closest('#bell')){
    const items = [];
    PROJECTS.forEach(p=>Object.entries(CONN[p.id]).forEach(([k,v])=>{ if (v.status==='bad'||v.status==='warn') items.push(`<button class="mi" data-v="int:${p.id}"><span style="color:${v.status==='bad'?'var(--bad)':'var(--warn)'}">${ic('alert','sm')}</span><span style="flex:1"><b>${esc(INTEG.find(i=>i.id===k).n)}</b> · ${esc(p.name)}<br><span class="muted" style="font-size:12px;font-weight:500">${esc(v.note||'')}</span></span></button>`); }));
    NOTIFS.slice(0,8).forEach(n=>items.push(`<button class="mi" data-v="lead:${n.id}"><span>${ic('bell','sm')}</span><span style="flex:1">${esc(n.text)}<br><span class="muted" style="font-size:12px;font-weight:500">${esc(P(n.p).name)} · ${ago(n.t)}</span></span></button>`));
    NOTIFS.forEach(n=>n.read=true);
    return openMenu($('#bell'), `<div class="mh">Notifications</div>${items.join('')||'<div class="empty">Nothing new</div>'}`, v=>{ closeLayer(); const [k,id]=v.split(':'); if (k==='int'){ st.project=id; st.view='integrations'; render(); } else openLead(id); }, {w:340});
  }
  const op = t.closest('[data-open-project]'); if (op){ st.project = op.dataset.openProject; st.view = op.dataset.goto || 'home'; return render(); }
  const act = t.closest('[data-act]');
  if (act){
    const a = act.dataset.act;
    if (a==='newproject') return newProjectWizard();
    if (a==='sharelink'){ st.view='settings'; st.settings.tab='link'; return render(); }
    if (a==='preview') return openPortal(st.project);
    if (a==='regen'){
      if (SETTINGS.link.revoked){ SETTINGS.link.revoked=false; SETTINGS.link.token = Math.random().toString(36).slice(2,6)+'-'+Math.random().toString(36).slice(2,6); render(); return toast('New link generated. Share it with the client.'); }
      $('#regenconfirm').innerHTML = `<div class="card" style="box-shadow:none;padding:14px;background:var(--tint);border-color:var(--tint40);display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:200px">The current link stops working immediately. Generate a new one now?</span><button class="btn sm" data-act="regenno">Keep current link</button><button class="btn sm dark" data-act="regenyes">Revoke and regenerate</button></div>`; return;
    }
    if (a==='regenno'){ $('#regenconfirm').innerHTML=''; return; }
    if (a==='regenyes'){ SETTINGS.link.token = Math.random().toString(36).slice(2,6)+'-'+Math.random().toString(36).slice(2,6); SETTINGS.link.opened='never'; render(); return toast('Old link revoked. New link is ready to copy.'); }
    if (a==='savequal'){ SETTINGS.mql=$('#smql').value; SETTINGS.sql=$('#ssql').value; SETTINGS.remind=$('#sremind').value; return toast('Qualification rules saved'); }
    if (a==='addreason'){ const v=$('#newreason').value.trim(); if (v){ SETTINGS.reasons.push(v); render(true); toast('Reason added'); } return; }
    if (a==='saveagency'){ const lang = $('#lang').value; return toast(lang.startsWith('English')?'Preferences saved':'Preferences saved. Interface language switches on next sign-in.'); }
    if (a==='export'){ return exportModal(leadsFiltered().ls); }
    if (a==='addlead'){
      const m = modal(`${mhead('Add a lead','For walk-ins, phone calls or referrals')}<form id="alf"><div class="mb"><div class="form">
        <label class="f full">Full name<input class="input" id="aln" required placeholder="e.g. Mariam Al Falasi"></label>
        <label class="f">Phone<input class="input" id="alp" required placeholder="+971 50 123 4567"></label>
        <label class="f">Email<input class="input" id="ale" type="email" placeholder="optional"></label>
        <label class="f">Client<select class="select" id="alc">${PROJECTS.map(p=>`<option value="${p.id}" ${st.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
        <label class="f">Owner<select class="select" id="alo"><option value="">Assign automatically</option>${TEAM.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}</select></label>
      </div></div><div class="mf"><button class="btn" type="button" data-x>Cancel</button><button class="btn primary" type="submit">Add lead</button></div></form>`);
      bindX(m);
      $('#alf').addEventListener('submit', ev=>{ ev.preventDefault(); const l = mkLead(3000+LEADS.length,{project:$('#alc').value, name:$('#aln').value.trim(), phone:$('#alp').value.trim(), age:0, status:'new', source:'website', owner:$('#alo').value||'rami'}); l.campaign='Manual entry'; l.chat=[]; l.unread=0; l.history=[{t:Date.now(), text:'Added manually by Aisha Rahman', r:true}]; if ($('#ale').value) l.email=$('#ale').value; LEADS.push(l); closeLayer(); render(); toast(l.name+' added', 'Lead'); });
      return;
    }
  }
  const lead = t.closest('[data-lead]'); if (lead && !t.closest('input,[data-statusmenu],select,[data-sel]')){ return openLead(lead.dataset.lead); }
  const chat = t.closest('[data-chat]'); if (chat){ const l=L(chat.dataset.chat); if (st.view!=='inbox' || (st.project!=='all' && l.project!==st.project)) return goChat(l.id); st.inbox.sel = l.id; st.inbox.open = true; l.unread = 0; return render(true); }
  const it = t.closest('[data-itab]'); if (it){ st.inbox.tab = it.dataset.itab; st.inbox.sel=null; return render(true); }
  const nm = t.closest('[data-num]'); if (nm){ st.inbox.num = nm.dataset.num; st.inbox.sel=null; return render(true); }
  if (t.closest('[data-back]') && !t.closest('.modal')){ st.inbox.open=false; return render(true); }
  if (t.closest('[data-showdet]')){ $('#inbox').classList.add('showdet'); return; }
  if (t.closest('[data-hidedet]')){ $('#inbox').classList.remove('showdet'); return; }
  const sr = t.closest('[data-star]'); if (sr){ const l=L(sr.dataset.star); l.starred=!l.starred; render(true); return toast(l.starred?'Starred':'Removed from starred'); }
  const an = t.closest('[data-addnote]'); if (an){ const v = $('#note').value.trim(); if (!v) return toast('Write a note first'); const l=L(an.dataset.addnote); l.notes.push({t:Date.now(), by:'aisha', text:v}); l.history.push({t:Date.now(), text:'Internal note added'}); render(true); return toast('Note added. Only your team can see it.'); }
  const ab = t.closest('[data-assignbtn],[data-assign]'); if (ab){ const id = ab.dataset.assignbtn || ab.dataset.assign;
    return openMenu(ab, `<div class="mh">Assign to</div>${TEAM.map(x=>`<button class="mi" data-v="${x.id}">${avatar(x.n)}<span style="flex:1">${esc(x.n)}</span><span class="muted" style="font-size:11.5px">${esc(x.role)}</span></button>`).join('')}`, v=>{ const l=L(id); l.owner=v; l.history.push({t:Date.now(), text:'Assigned to '+T(v).n}); closeLayer(); render(true); toast(`${l.name} assigned to ${T(v).n}`); }); }
  const q = t.closest('[data-qual]'); if (q){ const [id,s]=q.dataset.qual.split(':'); if (s==='nq') return askReason(id,null,()=>render(true)); setStatus(id,s); return render(true); }
  const ltab = t.closest('[data-ltab]'); if (ltab){ st.leads.tab = ltab.dataset.ltab; st.leads.sel.clear(); return render(true); }
  const sm = t.closest('[data-statusmenu]'); if (sm){ const id=sm.dataset.statusmenu; return openMenu(sm, `<div class="mh">Set status</div>${Object.keys(STATUS).map(s=>`<button class="mi" data-v="${s}">${pill(s)}</button>`).join('')}`, v=>{ closeLayer(); if (v==='nq') return askReason(id,null,()=>render(true)); setStatus(id,v); render(true); }, {w:190}); }
  const bulk = t.closest('[data-bulk]'); if (bulk){ const ids=[...st.leads.sel]; const b=bulk.dataset.bulk;
    if (b==='clear'){ st.leads.sel.clear(); return render(true); }
    if (b==='assign') return openMenu(bulk, `<div class="mh">Assign ${ids.length} leads to</div>${TEAM.map(x=>`<button class="mi" data-v="${x.id}">${avatar(x.n)}${esc(x.n)}</button>`).join('')}`, v=>{ ids.forEach(id=>{L(id).owner=v;}); st.leads.sel.clear(); closeLayer(); render(true); toast(`${ids.length} leads assigned to ${T(v).n}`); });
    if (b==='status') return openMenu(bulk, `<div class="mh">Set status for ${ids.length}</div>${['mql','sql','nq','junk'].map(s=>`<button class="mi" data-v="${s}">${pill(s)}</button>`).join('')}`, v=>{ ids.forEach(id=>{ const l=L(id); l.status=v; if (v==='nq'){l.reason='Not interested';} }); st.leads.sel.clear(); closeLayer(); render(true); toast(`${ids.length} leads marked ${STATUS[v]}`, 'Sent to Meta and Google'); }, {w:200});
  }
  const rg = t.closest('[data-range]'); if (rg){ st.reports.range = +rg.dataset.range; return render(true); }
  const cn = t.closest('[data-connect]'); if (cn) return connectFlow(cn.dataset.connect);
  const tl = t.closest('[data-test]'); if (tl){ const k=tl.dataset.test; const l = mkLead(6000+LEADS.length,{project:st.project, age:0, status:'new', name:'Test Lead', source:SOURCES[k]?k:'website'}); LEADS.push(l); CONN[st.project][k].last=0; render(true); return toast('Test lead received in under 2 seconds', INTEG.find(i=>i.id===k).n); }
  const rc = t.closest('[data-reconnect]'); if (rc){ const [pid,k]=rc.dataset.reconnect.split(':'); rc.innerHTML = '<span class="spin" style="width:14px;height:14px;border-width:2px"></span>Reconnecting'; rc.disabled=true;
    return setTimeout(()=>{ CONN[pid][k] = Object.assign({}, CONN[pid][k], {status:'ok', note:null, last:0}); render(true); toast(`${INTEG.find(i=>i.id===k).n} reconnected`, P(pid).name); }, 1000); }
  const stb = t.closest('[data-stab]'); if (stb){ st.settings.tab = stb.dataset.stab; return render(true); }
  const lt = t.closest('[data-lt]'); if (lt){ const k=lt.dataset.lt; SETTINGS.link[k]=!SETTINGS.link[k]; render(true); return toast({passcode:SETTINGS.link.passcode?'Passcode required. Code: '+SETTINGS.link.code:'Passcode removed', qualify:'Client marking '+(SETTINGS.link.qualify?'on':'off'), exportCsv:'Client export '+(SETTINGS.link.exportCsv?'on':'off')}[k]); }
  const fb = t.closest('[data-fb]'); if (fb){ const f=SETTINGS.feedback[+fb.dataset.fb]; f.on=!f.on; render(true); return toast(`${f.stage}: ${f.on?'sending':'not sent'}`); }
  const rr = t.closest('[data-rmreason]'); if (rr){ SETTINGS.reasons.splice(+rr.dataset.rmreason,1); return render(true); }
  const cp = t.closest('[data-copy]'); if (cp) return copyText(cp.dataset.copy, 'Link');
});
function onChange(e){
  const t = e.target;
  if (t.matches('[data-owner]')){ const l=L(t.dataset.owner); l.owner=t.value||null; l.history.push({t:Date.now(), text:t.value?'Assigned to '+T(t.value).n:'Unassigned'}); toast(t.value?`Assigned to ${T(t.value).n}`:'Unassigned'); softRender(); return; }
  
  if (t.matches('[data-role]')){ T(t.dataset.role).role=t.value; toast('Role updated'); return; }
  if (t.id==='lsrc'){ st.leads.source=t.value; render(true); }
  if (t.id==='lown'){ st.leads.owner=t.value; render(true); }
  if (t.id==='lexp'){ SETTINGS.link.expiry=t.value; toast('Link expiry updated'); }
  if (t.matches('[data-sel]')){ const id=t.dataset.sel; t.checked ? st.leads.sel.add(id) : st.leads.sel.delete(id); render(true); }
  if (t.id==='selall'){ const {ls}=leadsFiltered(); ls.forEach(l=> t.checked ? st.leads.sel.add(l.id) : st.leads.sel.delete(l.id)); render(true); }
  if (t.id==='psrc' && st.portal){ st.portal.source=t.value; renderPortal(); }
}
document.addEventListener('change', onChange);
document.addEventListener('input', e=>{
  if (e.target.id==='cq2'){ st.clientQ = e.target.value; softRender(); }
  if (e.target.id==='iq'){ st.inbox.q = e.target.value; softRender(); }
  if (e.target.id==='lq'){ st.leads.q = e.target.value; softRender(); }
});
document.addEventListener('submit', e=>{
  if (e.target.id==='invite'){ e.preventDefault(); const em=$('#invemail').value.trim(); const n = em.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); TEAM.push({id:'u'+Date.now(), n, ini:ini(n), role:$('#invrole').value, email:em}); render(true); toast('Invitation sent to '+em); }
  if (e.target.id==='pcform'){ e.preventDefault(); if ($('#pcode').value===SETTINGS.link.code){ st.portal.unlocked=true; renderPortal(); } else { $('#pcerr').textContent='That code doesn\'t match. Check with your account manager.'; } }
});
document.addEventListener('keydown', e=>{
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if (!st.portal) commandPalette(); }
  if (st.view==='inbox' && !st.portal && !$('#layer').innerHTML && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){
    if (e.key==='j'||e.key==='k'){ const {ls}=inboxList(); const i = ls.findIndex(l=>l.id===st.inbox.sel); const n = ls[Math.max(0,Math.min(ls.length-1, i+(e.key==='j'?1:-1)))]; if (n){ st.inbox.sel=n.id; n.unread=0; render(true); } }
  }
});

/* live simulation */
let tick = 0;
setInterval(()=>{ if (document.hidden) return; tick++; if (tick % 2 === 0) addLiveLead(); else addLiveMessage(); }, 22000);
setInterval(()=>{ if (!st.portal && !$('#layer').innerHTML && !document.activeElement.matches('input,textarea,select')) softRender(); }, 60000);

render();
})();
</script>
